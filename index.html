<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamr Subgraph Explorer</title>

    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <meta name="theme-color" content="#00060A">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-gray-200">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-4 left-4 z-[60] flex flex-col-reverse gap-3 pointer-events-none max-w-sm w-full"></div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 bg-black/75 flex items-center justify-center p-3 sm:p-4 z-50 hidden">
        <div class="bg-[#1E1E1E] rounded-lg p-5 sm:p-8 max-w-md w-full text-gray-300 border border-[#333333] shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl sm:text-2xl font-bold mb-3 sm:mb-4 text-white">Settings</h2>
            <div class="space-y-4">
                <div>
                    <label for="modalGraphBaseUrl" class="block text-sm font-medium text-gray-400 mb-2">Gateway Base URL</label>
                    <input type="url" id="modalGraphBaseUrl" value="https://gateway-arbitrum.network.thegraph.com/api/"
                           class="w-full p-3 bg-[#121212] border border-[#333333] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-[#555555]"
                           placeholder="The Graph Gateway Base URL">
                </div>
                <div>
                    <label for="modalApiKey" class="block text-sm font-medium text-gray-400 mb-2"><a href="https://thegraph.com/studio/apikeys/" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors underline underline-offset-2">The Graph</a> API Key</label>
                    <input type="text" id="modalApiKey" value="17529bf475dfe3e7b7a0551668c91c63"
                           class="w-full p-3 bg-[#121212] border border-[#333333] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-[#555555]"
                           placeholder="Enter your The Graph API key">
                </div>
                <div>
                    <label for="modalSubgraphId" class="block text-sm font-medium text-gray-400 mb-2">Subgraph ID</label>
                    <input type="text" id="modalSubgraphId" value="EGWFdhhiWypDuz22Uy7b3F69E9MEkyfU9iAQMttkH5Rj"
                           class="w-full p-3 bg-[#121212] border border-[#333333] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-[#555555]"
                           placeholder="Enter the Subgraph ID">
                </div>
            </div>
            <div class="mt-6 flex gap-4">
                <button onclick="closeSettingsModal()" class="w-full bg-[#444444] hover:bg-[#555555] text-white font-bold py-3 px-4 rounded-lg transition-colors">Cancel</button>
                <button onclick="saveSettingsAndClose()" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg transition-colors">Save & Update</button>
            </div>
        </div>
    </div>
    <!-- END MODAL -->

    <!-- HIDDEN API/SUBGRAPH INPUTS (USED BY JS) -->
    <input type="hidden" id="graphBaseUrl" value="https://gateway-arbitrum.network.thegraph.com/api/">
    <input type="hidden" id="apiKey" value="17529bf475dfe3e7b7a0551668c91c63">
    <input type="hidden" id="subgraphId" value="EGWFdhhiWypDuz22Uy7b3F69E9MEkyfU9iAQMttkH5Rj">

    <!-- ===== SIDEBAR (Desktop) ===== -->
    <aside id="app-sidebar" class="hidden lg:flex flex-col fixed left-0 top-0 h-full w-72 bg-[#1A1A1A] border-r border-[#2a2a2a] z-40">
        <!-- Logo -->
        <div class="h-14 flex items-center px-5 border-b border-[#2a2a2a] flex-shrink-0">
            <img src="favicon/favicon-96x96.png" alt="" class="w-9 h-9 flex-shrink-0 object-contain">
            <span class="ml-3 text-lg font-bold text-white whitespace-nowrap">Subgraph Explorer</span>
        </div>

        <!-- Entity Navigation (populated by JS: populateEntityDropdown) -->
        <nav id="entity-nav" class="flex-1 py-3 overflow-y-auto"></nav>

        <!-- Bottom Section -->
        <div class="border-t border-[#2a2a2a] p-2 flex-shrink-0">
            <button onclick="openSettingsModal()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1.51-1V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="text-sm font-medium">Settings</span>
            </button>
        </div>
    </aside>

    <!-- ===== MOBILE HEADER ===== -->
    <header id="mobile-header" class="lg:hidden fixed top-0 left-0 right-0 z-30 bg-[#121212]/95 backdrop-blur-md border-b border-[#2a2a2a] safe-area-top">
        <div class="flex items-center justify-between px-4 h-14">
            <div class="flex items-center gap-3 min-w-0">
                <img src="favicon/favicon-96x96.png" alt="" class="w-8 h-8 flex-shrink-0">
                <h1 class="text-lg font-bold text-white truncate">Subgraph Explorer</h1>
            </div>
            <button onclick="openSettingsModal()" class="p-2 rounded-lg bg-[#1E1E1E] border border-[#333] text-gray-400 hover:text-white transition-colors" title="Settings">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1.51-1V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- ===== DESKTOP HEADER ===== -->
    <header id="desktop-header" class="hidden lg:block fixed top-0 right-0 left-72 z-30 bg-[#121212]/95 backdrop-blur-md border-b border-[#2a2a2a]">
        <div class="flex items-center justify-between px-6 h-14 w-full gap-4">
            <div class="flex items-center gap-3 min-w-0">
                <h1 id="desktop-page-title" class="text-lg font-semibold text-white whitespace-nowrap">Operators</h1>
                <span id="desktop-page-category" class="px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-widest text-gray-400 bg-[#1E1E1E] border border-[#333]"></span>
                <p id="desktop-page-description" class="text-sm text-gray-500 truncate"></p>
            </div>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#1E1E1E] border border-[#333] flex-shrink-0">
                <span class="text-xs text-gray-400">Gateway:</span>
                <span class="text-sm font-bold text-green-400">The Graph</span>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div id="main-container" class="pt-16 pb-6 lg:pl-72">
        <main class="p-4 md:p-6">
            <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">

                <!-- LEFT: Query Configuration -->
                <div class="xl:col-span-5 space-y-6">
                    <section class="detail-section p-4 sm:p-6">
                        <h2 class="text-lg font-semibold text-white mb-4">Query</h2>

                        <div class="space-y-4">
                            <!-- Entity Selector (mobile/tablet; the sidebar replaces it on desktop) -->
                            <div class="lg:hidden">
                                <label for="entityName" class="block text-xs font-medium text-gray-500 mb-1.5">Entity</label>
                                <select id="entityName" onchange="selectEntity(this.value)"
                                        class="w-full p-3 bg-[#121212] border border-[#333333] rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all">
                                    <!-- Options will be populated by JavaScript -->
                                </select>
                                <p id="mobile-page-description" class="text-xs text-gray-500 mt-1.5"></p>
                            </div>

                            <div class="grid grid-cols-2 2xl:grid-cols-4 gap-3">
                                <!-- Limit Input -->
                                <div>
                                    <label for="queryLimit" class="block text-xs font-medium text-gray-500 mb-1.5">Limit (max 1000)</label>
                                    <input type="number" id="queryLimit" value="10" min="1" max="1000" oninput="updateRawQueryPreview()"
                                           class="w-full p-2.5 bg-[#121212] border border-[#333333] rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all">
                                </div>

                                <!-- Offset (Skip) -->
                                <div>
                                    <label for="querySkip" class="block text-xs font-medium text-gray-500 mb-1.5">Offset (skip)</label>
                                    <input type="number" id="querySkip" value="0" min="0" oninput="updateRawQueryPreview(); checkPaginationButtons();"
                                           class="w-full p-2.5 bg-[#121212] border border-[#333333] rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all">
                                </div>

                                <!-- Order By Field Selector -->
                                <div>
                                    <label for="orderByField" class="block text-xs font-medium text-gray-500 mb-1.5">Order by</label>
                                    <select id="orderByField" onchange="updateRawQueryPreview();"
                                            class="w-full p-2.5 bg-[#121212] border border-[#333333] rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all">
                                        <!-- Options populated by JS: updateFilterInputs() -->
                                    </select>
                                </div>

                                <!-- Order Direction Selector -->
                                <div>
                                    <label for="orderDirection" class="block text-xs font-medium text-gray-500 mb-1.5">Direction</label>
                                    <select id="orderDirection" onchange="updateRawQueryPreview();"
                                            class="w-full p-2.5 bg-[#121212] border border-[#333333] rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all">
                                        <option value="desc" selected>Descending</option>
                                        <option value="asc">Ascending</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Filters -->
                    <section id="advancedFiltersContainer" class="detail-section p-4 sm:p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-semibold text-white">Filters <span id="activeFilterCount" class="ml-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-500/15 text-blue-400 hidden"></span></h2>
                            <button id="clearFiltersButton" onclick="clearFilters()" class="text-xs font-medium text-gray-400 hover:text-white transition-colors hidden">Clear all</button>
                        </div>
                        <div id="filterInputs">
                            <!-- Filter inputs will be injected here via JavaScript -->
                        </div>
                    </section>

                    <!-- GraphQL Query (auto-generated, editable) -->
                    <section id="rawQueryContainer" class="detail-section p-4 sm:p-6">
                        <div class="flex items-center justify-between mb-3">
                            <label for="rawQueryInput" class="text-lg font-semibold text-white">GraphQL</label>
                            <button id="resetQueryButton" onclick="resetManualQuery()" class="text-xs font-medium text-gray-400 hover:text-white transition-colors hidden">Reset to form</button>
                        </div>
                        <textarea id="rawQueryInput" rows="8" oninput="checkRawOverride()" spellcheck="false"
                                  class="w-full p-3 bg-[#121212] border border-[#333333] rounded-lg text-gray-200 font-mono text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
                                  placeholder="Paste your GraphQL query here or edit the preview."></textarea>
                        <p id="manualOverrideHint" class="text-xs text-amber-500 mt-2 hidden">Manual query active: form filters are ignored.</p>

                        <!-- Execute Button and Pagination Controls -->
                        <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-between items-center">
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button id="prevPageButton" onclick="changePage(-1)" class="flex-grow sm:flex-grow-0 bg-[#2C2C2C] hover:bg-[#3A3A3A] disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg transition-colors" disabled>
                                    &larr; Previous
                                </button>
                                <button id="nextPageButton" onclick="changePage(1)" class="flex-grow sm:flex-grow-0 bg-[#2C2C2C] hover:bg-[#3A3A3A] disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg transition-colors" disabled>
                                    Next &rarr;
                                </button>
                            </div>
                            <button id="executeButton" onclick="executeQuery()" class="w-full sm:w-auto bg-blue-800 hover:bg-blue-900 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2">
                                Execute Query
                            </button>
                        </div>
                    </section>
                </div>

                <!-- RIGHT: Results -->
                <div class="xl:col-span-7">
                    <section class="detail-section p-4 sm:p-6 xl:sticky xl:top-20">
                        <div class="flex items-center justify-between mb-4 gap-3">
                            <div class="flex items-center gap-3 min-w-0">
                                <h2 class="text-lg font-semibold text-white">Result</h2>
                                <span id="resultMeta" class="text-xs text-gray-500 truncate"></span>
                            </div>
                            <button id="copyButton" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#2C2C2C] hover:bg-[#3A3A3A] text-sm text-gray-300 hover:text-white font-medium transition-colors" onclick="copyResults()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                Copy JSON
                            </button>
                        </div>

                        <!-- Loading/Error/Result Display -->
                        <div id="outputArea" class="bg-[#121212] border border-[#333333] rounded-lg p-4 text-sm text-gray-300 overflow-auto min-h-[300px] max-h-[70vh] xl:max-h-[calc(100vh-11rem)]">
                            <p class="text-gray-500">Waiting for query execution...</p>
                        </div>

                        <p id="errorAlert" class="mt-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-sm text-red-400 font-mono whitespace-pre-wrap break-all hidden"></p>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        let isManualOverride = false; 
        
        // =====================================================
        // ENTITY_CONFIG - Centralized Configuration for All Entities
        // =====================================================
        const ENTITY_CONFIG = {
            // ─────────────────────────────────────────────────
            // STREAMS & PERMISSIONS
            // ─────────────────────────────────────────────────
            streams: {
                label: 'Stream',
                category: 'Data',
                queryType: 'list',
                singularQuery: 'stream',
                description: 'Data streams on the Streamr network - includes permissions, storage nodes and sponsorships',
                fields: `id idAsString metadata createdAt updatedAt 
                    permissions(first: 10) { id userId userAddress canEdit canDelete canGrant publishExpiration subscribeExpiration } 
                    storageNodes(first: 5) { id metadata lastSeen } 
                    sponsorships(first: 5) { id spotAPY totalStakedWei remainingWei isRunning operatorCount }`,
                sortFields: [
                    { value: 'id', label: 'ID (Address/Path)' },
                    { value: 'idAsString', label: 'ID (Substring Searchable)' },
                    { value: 'createdAt', label: 'Created At' },
                    { value: 'updatedAt', label: 'Updated At' },
                ],
                defaultSort: { field: 'createdAt', direction: 'desc' },
                filters: [
                    { id: 'streamIdFilter', field: 'idAsString_contains_nocase', label: 'Stream ID Contains', type: 'text', placeholder: 'Ex: streamr-dev/my-stream' },
                    { id: 'streamIdExact', field: 'id', label: 'Stream ID (Exact)', type: 'text', placeholder: 'Full stream ID' },
                    { id: 'streamIdStartsWith', field: 'idAsString_starts_with', label: 'Stream ID Starts With (e.g. creator address)', type: 'text', placeholder: '0x...' },
                    { id: 'streamMetadataFilter', field: 'metadata_contains_nocase', label: 'Metadata Contains', type: 'text', placeholder: "Ex: 'sensor-data'" },
                    { id: 'streamMetadataNotNull', field: 'metadata_not', label: 'Has Metadata (not empty)', type: 'toggle', value: '""' },
                    { id: 'streamMinCreatedAt', field: 'createdAt_gte', label: 'Created After', type: 'datetime' },
                    { id: 'streamMaxCreatedAt', field: 'createdAt_lte', label: 'Created Before', type: 'datetime' },
                    { id: 'streamMinUpdatedAt', field: 'updatedAt_gte', label: 'Updated After', type: 'datetime' },
                    { id: 'streamMaxUpdatedAt', field: 'updatedAt_lte', label: 'Updated Before', type: 'datetime' },
                ],
            },
            streamPermissions: {
                label: 'Stream Permission',
                category: 'Data',
                queryType: 'list',
                singularQuery: 'streamPermission',
                description: 'User permissions on streams - publish, subscribe, edit, delete and grant capabilities',
                fields: 'id userAddress userId stream { id idAsString metadata createdAt } canEdit canDelete canGrant publishExpiration subscribeExpiration',
                sortFields: [
                    { value: 'id', label: 'ID' },
                    { value: 'userAddress', label: 'User Address' },
                    { value: 'userId', label: 'User ID' },
                    { value: 'publishExpiration', label: 'Publish Expiration' },
                    { value: 'subscribeExpiration', label: 'Subscribe Expiration' },
                ],
                defaultSort: { field: 'id', direction: 'asc' },
                filters: [
                    { id: 'permUserAddress', field: 'userAddress', label: 'User Address', type: 'address', placeholder: '0x...' },
                    { id: 'permUserAddressContains', field: 'userAddress_contains', label: 'User Address Contains', type: 'text', placeholder: '0x...' },
                    { id: 'permUserId', field: 'userId', label: 'User ID', type: 'address', placeholder: '0x...' },
                    { id: 'permUserIdContains', field: 'userId_contains', label: 'User ID Contains', type: 'address', placeholder: '0x...' },
                    { id: 'permStreamId', field: 'stream', label: 'Stream ID', type: 'text', placeholder: 'Stream address/path' },
                    { id: 'permStreamContains', field: 'stream_contains', label: 'Stream ID Contains', type: 'text', placeholder: 'stream' },
                    { id: 'permCanEdit', field: 'canEdit', label: 'Can Edit', type: 'boolean' },
                    { id: 'permCanDelete', field: 'canDelete', label: 'Can Delete', type: 'boolean' },
                    { id: 'permCanGrant', field: 'canGrant', label: 'Can Grant', type: 'boolean' },
                    { id: 'permMinPublishExp', field: 'publishExpiration_gte', label: 'Publish Expires After', type: 'datetime' },
                    { id: 'permMaxPublishExp', field: 'publishExpiration_lte', label: 'Publish Expires Before', type: 'datetime' },
                    { id: 'permMinSubscribeExp', field: 'subscribeExpiration_gte', label: 'Subscribe Expires After', type: 'datetime' },
                    { id: 'permMaxSubscribeExp', field: 'subscribeExpiration_lte', label: 'Subscribe Expires Before', type: 'datetime' },
                    { id: 'permHasPublish', field: 'publishExpiration_gt', label: 'Has Publish Permission (exp > 0)', type: 'toggle', value: '"0"' },
                    { id: 'permHasSubscribe', field: 'subscribeExpiration_gt', label: 'Has Subscribe Permission (exp > 0)', type: 'toggle', value: '"0"' },
                ],
            },
            // ─────────────────────────────────────────────────
            // SPONSORSHIPS
            // ─────────────────────────────────────────────────
            sponsorships: {
                label: 'Sponsorship',
                category: 'Staking',
                queryType: 'list',
                singularQuery: 'sponsorship',
                description: 'Sponsorship contracts for streams - includes staking, APY, operators and events',
                fields: `id stream { id idAsString metadata } metadata creator totalPayoutWeiPerSec remainingWei remainingWeiUpdateTimestamp 
                    projectedInsolvency spotAPY operatorCount minOperators maxOperators minimumStakingPeriodSeconds totalStakedWei cumulativeSponsoring isRunning
                    stakes(first: 5) { id operator { id metadataJsonString } amountWei earningsWei }
                    flags(first: 3) { id result target { id } flagger { id } flaggingTimestamp }
                    slashingEvents(first: 3) { id operator { id } amount date }
                    stakingEvents(first: 5) { id operator { id } amount date }
                    sponsoringEvents(first: 3) { id sponsor amount date }`,
                sortFields: [
                    { value: 'id', label: 'ID (Address)' },
                    { value: 'spotAPY', label: 'Spot APY' },
                    { value: 'remainingWei', label: 'Remaining Funds' },
                    { value: 'totalPayoutWeiPerSec', label: 'Payout Per Second' },
                    { value: 'operatorCount', label: 'Operator Count' },
                    { value: 'totalStakedWei', label: 'Total Staked' },
                    { value: 'projectedInsolvency', label: 'Projected Insolvency' },
                    { value: 'cumulativeSponsoring', label: 'Cumulative Sponsoring' },
                    { value: 'minimumStakingPeriodSeconds', label: 'Min Staking Period' },
                    { value: 'minOperators', label: 'Min Operators Required' },
                    { value: 'maxOperators', label: 'Max Operators Allowed' },
                ],

        /**
         * Converts a datetime-local string (YYYY-MM-DDThh:mm) to a Unix timestamp (seconds).
         * Returns null if the input is empty or invalid.
         */
        function dateToTimestamp(dateString) {
            if (!dateString) return null;
            try {
                // Parse the local date string to a Date object, treating it as local time
                const date = new Date(dateString);
                // Return timestamp in seconds
                return Math.floor(date.getTime() / 1000).toString();
            } catch (e) {
                console.error("Invalid date conversion:", e);
                return null;
            }
        }
        
        /**
         * Converts a human-readable DATA amount (as a string) to a BigInt string in Wei.
         * Handles decimal values by multiplying by 10^18.
         * Returns null if input is invalid.
         */
        function dataToWei(dataAmount) {
            if (!dataAmount) return null;
            try {
                const DECIMAL_PLACES = 18;
                // Keep the sign apart so negative decimals (e.g. -0.5) convert correctly
                const isNegative = dataAmount.trim().startsWith('-');
                const unsignedAmount = dataAmount.trim().replace(/^[-+]/, '');
                const [integerPartStr, fractionalPartStr] = unsignedAmount.split('.').concat('');
                
                const integerPart = BigInt(integerPartStr || '0');
                
                let fractionalWei = BigInt(0);
                if (fractionalPartStr) {
                    const trimmedFractional = fractionalPartStr.slice(0, DECIMAL_PLACES);
                    const trailingZeros = DECIMAL_PLACES - trimmedFractional.length;
                    
                    // Convert the fractional part to a BigInt and scale it correctly
                    fractionalWei = BigInt(trimmedFractional) * (BigInt(10) ** BigInt(trailingZeros));
                }
                
                // Convert the integer part to Wei and add the scaled fractional part
                const integerWei = integerPart * (BigInt(10) ** BigInt(DECIMAL_PLACES));
                
                const totalWei = integerWei + fractionalWei;
                return (isNegative ? -totalWei : totalWei).toString();

            } catch (e) {
                // Return null if BigInt conversion fails (e.g., input contains non-numeric chars)
                return null;
            }
        }
        
        /**
         * Formats BigInt (Wei) to a readable number (division by 1e18) using BigInt math for precision.
         */
        function formatWei(wei) {
            if (!wei) return '0';
            try {
                // Wei uses 18 decimals, so we use 10^18 for conversion
                const DECIMAL_PLACES = 18;
                const WEI_PER_UNIT = BigInt(10) ** BigInt(DECIMAL_PLACES);

                const bigIntValue = BigInt(wei);
                
                // For extremely large numbers, return BigInt truncated for readability
                if (bigIntValue >= WEI_PER_UNIT * BigInt(1000000000000)) { // Example threshold: 1 trillion DATA
                    return `(BigInt) ${wei.toString().slice(0, 10)}...`;
                }

                // Convert BigInt to two parts: integer and fractional
                const integerPart = bigIntValue / WEI_PER_UNIT;
                let fractionalPart = bigIntValue % WEI_PER_UNIT;
                
                // Pad fractional part with leading zeros if necessary
                let fractionalString = fractionalPart.toString().padStart(DECIMAL_PLACES, '0');
                
                // Trim trailing zeros for a clean display, keeping up to 4 significant digits
                fractionalString = fractionalString.replace(/0+$/, '');
                fractionalString = fractionalString.slice(0, 4); // Keep up to 4 decimals max for display

                if (fractionalString === '') {
                    return integerPart.toString();
                }

                return `${integerPart}.${fractionalString}`;

            } catch (e) {
                // Fallback for non-BigInt compatible values or errors
                return `(Wei) ${wei}`;
            }
        }
        
        /**
         * Formats a UNIX timestamp (seconds) into a readable date string.
         */
        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            try {
                // Convert to milliseconds
                const date = new Date(parseInt(timestamp) * 1000);
                // Formats to Portugal/Brazil localized date and time
                return date.toLocaleString('pt-PT', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    timeZoneName: 'short'
                });
            } catch (e) {
                return `(Timestamp) ${timestamp}`;
            }
        }

        /**
         * Generates HTML for a single filter input based on its type.
         */
        function generateFilterInput(filter) {
            const onInputChange = 'updateRawQueryPreview()';
            const baseInputClass = 'w-full p-2.5 bg-[#121212] border border-[#333333] rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all';
            
            let inputHtml = '';
            
            switch (filter.type) {
                case 'text':
                case 'address':
                    inputHtml = `
                        <input type="text" id="${filter.id}" oninput="${onInputChange}"
                               class="${baseInputClass} ${filter.type === 'address' ? 'font-mono' : ''}"
                               placeholder="${filter.placeholder || ''}">
                    `;
                    break;
                    
                case 'number':
                    inputHtml = `
                        <input type="number" id="${filter.id}" oninput="${onInputChange}"
                               step="${filter.step || '1'}"
                               class="${baseInputClass}"
                               placeholder="${filter.placeholder || ''}">
                    `;
                    break;
                    
                case 'wei':
                    inputHtml = `
                        <input type="text" id="${filter.id}" oninput="${onInputChange}"
                               class="${baseInputClass}"
                               placeholder="${filter.placeholder || ''}"
                               title="Enter amount in DATA tokens (will be converted to Wei)">
                    `;
                    break;
                    
                case 'fraction':
                    inputHtml = `
                        <input type="number" id="${filter.id}" oninput="${onInputChange}"
                               step="0.0001" min="0" max="1"
                               class="${baseInputClass}"
                               placeholder="${filter.placeholder || ''}"
                               title="Enter a value between 0 and 1">
                    `;
                    break;
                    
                case 'datetime':
                    inputHtml = `
                        <input type="datetime-local" id="${filter.id}" onchange="${onInputChange}"
                               class="${baseInputClass}">
                    `;
                    break;
                    
                case 'boolean':
                    inputHtml = `
                        <select id="${filter.id}" onchange="${onInputChange}" class="${baseInputClass}">
                            <option value="">-- Any --</option>
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    `;
                    break;

                case 'toggle':
                    // Applies a fixed condition (filter.value) when set to "Yes"
                    inputHtml = `
                        <select id="${filter.id}" onchange="${onInputChange}" class="${baseInputClass}">
                            <option value="">-- Any --</option>
                            <option value="on">Yes</option>
                        </select>
                    `;
                    break;

                case 'select':
                    inputHtml = `
                        <select id="${filter.id}" onchange="${onInputChange}" class="${baseInputClass}">
                            <option value="">-- Any --</option>
                            ${filter.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                    `;
                    break;
                    
                default:
                    inputHtml = `
                        <input type="text" id="${filter.id}" oninput="${onInputChange}"
                               class="${baseInputClass}"
                               placeholder="${filter.placeholder || ''}">
                    `;
            }
            
            return `
                <div class="w-full">
                    <label for="${filter.id}" class="block text-xs font-medium text-gray-500 mb-1.5">
                        ${filter.label}${filter.required ? ' <span class="text-red-400">*</span>' : ''}
                    </label>
                    ${inputHtml}
                </div>
            `;
        }

        /**
         * Extracts filter values from the DOM and builds the query 'where' string using ENTITY_CONFIG.
         */
        function getFilterWhereClause(entityName) {
            const config = ENTITY_CONFIG[entityName];
            if (!config || !config.filters) return '';
            
            const filters = [];
            
            config.filters.forEach(filter => {
                const element = document.getElementById(filter.id);
                if (!element) return;
                
                const rawValue = element.value.trim();
                if (!rawValue) return;
                
                let processedValue = rawValue;
                let filterString = '';
                
                switch (filter.type) {
                    case 'address':
                        // Lowercase addresses for consistency
                        processedValue = rawValue.toLowerCase();
                        filterString = `${filter.field}: "${processedValue}"`;
                        break;
                        
                    case 'text':
                        // Check if field expects lowercase (contains_nocase doesn't need it)
                        if (filter.field.includes('_contains') && !filter.field.includes('nocase')) {
                            processedValue = rawValue.toLowerCase();
                        }
                        filterString = `${filter.field}: "${processedValue}"`;
                        break;
                        
                    case 'number':
                        filterString = `${filter.field}: ${rawValue}`;
                        break;
                        
                    case 'wei':
                        // Convert DATA to Wei
                        const weiValue = dataToWei(rawValue);
                        if (weiValue) {
                            filterString = `${filter.field}: "${weiValue}"`;
                        }
                        break;
                        
                    case 'fraction':
                        // Convert fraction (0-1) to BigInt (multiply by 1e18)
                        try {
                            const fraction = parseFloat(rawValue);
                            if (!isNaN(fraction) && fraction >= 0 && fraction <= 1) {
                                const fractionWei = BigInt(Math.round(fraction * 1e18)).toString();
                                filterString = `${filter.field}: "${fractionWei}"`;
                            }
                        } catch (e) {
                            console.error('Invalid fraction value:', e);
                        }
                        break;
                        
                    case 'datetime':
                        const timestamp = dateToTimestamp(rawValue);
                        if (timestamp) {
                            // Int fields must be sent as numbers, BigInt fields as strings
                            filterString = filter.valueType === 'Int'
                                ? `${filter.field}: ${timestamp}`
                                : `${filter.field}: "${timestamp}"`;
                        }
                        break;
                        
                    case 'boolean':
                        if (rawValue === 'true' || rawValue === 'false') {
                            filterString = `${filter.field}: ${rawValue}`;
                        }
                        break;

                    case 'toggle':
                        if (rawValue === 'on') {
                            const value = typeof filter.value === 'function' ? filter.value() : filter.value;
                            filterString = `${filter.field}: ${value}`;
                        }
                        break;

                    case 'select':
                        if (filter.options.includes(rawValue)) {
                            filterString = `${filter.field}: "${rawValue}"`;
                        }
                        break;
                        
                    default:
                        filterString = `${filter.field}: "${processedValue}"`;
                }
                
                if (filterString) {
                    filters.push(filterString);
                }
            });
            
            return filters.join(', ');
        }
        
        /**
         * Generates the auto-completed GraphQL query from form fields using ENTITY_CONFIG.
         */
        function getAutoGeneratedQuery() {
             const entityName = document.getElementById('entityName').value;
             const config = ENTITY_CONFIG[entityName];
             
             if (!config) {
                 return `# Unknown entity: ${entityName}`;
             }
             
             const queryLimit = parseInt(document.getElementById('queryLimit').value) || 10;
             const querySkip = parseInt(document.getElementById('querySkip').value) || 0;
             const orderByField = document.getElementById('orderByField').value;
             const orderDirection = document.getElementById('orderDirection').value;
             const filterContents = getFilterWhereClause(entityName);
             
             let query;
             
             // Handle _meta query (special no-argument query)
             if (config.queryType === 'meta') {
                 query = `
query GetSubgraphMeta {
    _meta {
        ${config.fields}
    }
}
                 `;
             }
             // Handle single entity queries (like 'network')
             else if (config.queryType === 'single') {
                 // For single queries, we need an ID from filters
                 let idFilter = '';
                 if (config.filters && config.filters.length > 0) {
                     config.filters.forEach(filter => {
                         const el = document.getElementById(filter.id);
                         if (el && el.value.trim()) {
                             if (filter.field === 'id') {
                                 idFilter = el.value.trim().toLowerCase();
                             }
                         }
                     });
                     
                     // Use default ID if none provided
                     if (!idFilter && config.filters.some(f => f.defaultValue)) {
                         const defaultFilter = config.filters.find(f => f.defaultValue);
                         idFilter = defaultFilter.defaultValue;
                     }
                 }
                 
                 // Build the query with or without ID parameter
                 if (config.singleIdRequired && idFilter) {
                     query = `
query Get${config.label.replace(/[\s()]/g, '')} {
    ${config.singularQuery}(id: "${idFilter}", subgraphError: allow) {
        ${config.fields}
    }
}
                     `;
                 } else if (config.listFallback) {
                     query = `
# No ID provided: returning the first ${config.label} from the list query
query Get${config.label.replace(/[\s()]/g, '')} {
    ${config.listFallback}(first: 1, subgraphError: allow) {
        ${config.fields}
    }
}
                     `;
                 } else if (!config.singleIdRequired) {
                     query = `
query Get${config.label.replace(/[\s()]/g, '')} {
    ${config.singularQuery} {
        ${config.fields}
    }
}
                     `;
                 } else {
                     query = `
# Please provide an ID in the filter to query ${config.label}
query Get${config.label.replace(/[\s()]/g, '')} {
    ${config.singularQuery}(id: "YOUR_ID_HERE", subgraphError: allow) {
        ${config.fields}
    }
}
                     `;
                 }
             } else {
                 // Standard list query
                 let argsArray = [
                     `first: ${queryLimit}`,
                     `skip: ${querySkip}`,
                     `orderBy: ${orderByField}`,
                     `orderDirection: ${orderDirection}`
                 ];

                 if (filterContents) {
                     argsArray.push(`where: {${filterContents}}`);
                 }

                 argsArray.push(`subgraphError: allow`);
                 const args = argsArray.join(', ');

                 query = `
query Get${config.label.replace(/[\s()]/g, '')}s {
    ${entityName}(${args}) {
        ${config.fields}
    }
}
                 `;
             }
             
             return query;
        }

        /**
         * Generates the GraphQL query and populates the Raw Query field.
         */
        window.updateRawQueryPreview = function() {
             const rawQueryInput = document.getElementById('rawQueryInput');
             updateActiveFilterCount();
             
             if (!isManualOverride) {
                 // Apply trim() to remove leading newline characters
                 rawQueryInput.value = getAutoGeneratedQuery().trim();
                 document.getElementById('manualOverrideHint').classList.add('hidden');
             } else {
                 // If manually overridden, check if the content matches the auto-generated query to turn off the flag
                 const currentAutoQuery = getAutoGeneratedQuery().trim();
                 if (rawQueryInput.value.trim() === currentAutoQuery) {
                    isManualOverride = false;
                    rawQueryInput.value = currentAutoQuery;
                    document.getElementById('manualOverrideHint').classList.add('hidden');
                 } else {
                    document.getElementById('manualOverrideHint').classList.remove('hidden');
                 }
             }

             document.getElementById('resetQueryButton').classList.toggle('hidden', !isManualOverride);
             checkInputs(); 
        }

        // --- GraphQL Query Logic ---

        /**
         * Helper function to retrieve the fields for a given entity type from ENTITY_CONFIG.
         */
        function getQueryFields(entityName) {
            const config = ENTITY_CONFIG[entityName];
            return config ? config.fields : 'id';
        }

        /**
         * Populates the entity dropdown with all entities grouped by category.
         */
        function populateEntityDropdown() {
            const select = document.getElementById('entityName');
            select.innerHTML = '';
            
            const nav = document.getElementById('entity-nav');
            nav.innerHTML = '';
            
            // Group entities by category
            const categories = {};
            Object.entries(ENTITY_CONFIG).forEach(([key, config]) => {
                if (!categories[config.category]) {
                    categories[config.category] = [];
                }
                categories[config.category].push({ key, ...config });
            });
            
            // Create an optgroup (mobile select) and a sidebar section for each category
            CATEGORY_ORDER.forEach((category, index) => {
                if (!categories[category]) return;

                const optgroup = document.createElement('optgroup');
                optgroup.label = `${category} (${categories[category].length})`;

                let navHtml = `
                    ${index > 0 ? '<div class="my-3 mx-3 border-t border-white/[0.04]"></div>' : ''}
                    <div class="px-3 pt-2 pb-1 flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CATEGORY_ICONS[category] || ''}</svg>
                        <span class="text-[10px] font-semibold text-gray-600 uppercase tracking-widest">${category}</span>
                    </div>
                `;

                categories[category].forEach(entity => {
                    const option = document.createElement('option');
                    option.value = entity.key;
                    option.textContent = entity.label;
                    option.title = entity.description;
                    optgroup.appendChild(option);

                    navHtml += `
                        <a href="#" data-entity="${entity.key}" title="${entity.description}"
                           onclick="event.preventDefault(); selectEntity('${entity.key}');"
                           class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-400 hover:text-white hover:bg-white/[0.03] transition-all duration-200">
                            ${entity.label}
                        </a>
                    `;
                });

                select.appendChild(optgroup);
                nav.insertAdjacentHTML('beforeend', `<div class="px-2 space-y-0.5">${navHtml}</div>`);
            });
            
            // Set default selection
            select.value = 'operators';
        }

        /**
         * Executes the GraphQL query and displays the results.
         */
        window.executeQuery = async function() {
            const graphBaseUrl = document.getElementById('graphBaseUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const subgraphId = document.getElementById('subgraphId').value.trim();
            const entityName = document.getElementById('entityName').value;
            
            const rawQueryInput = document.getElementById('rawQueryInput');
            
            const outputArea = document.getElementById('outputArea');
            const errorAlert = document.getElementById('errorAlert');
            const executeButton = document.getElementById('executeButton');
            const copyButton = document.getElementById('copyButton');
            
            // 1. URL CONSTRUCTION
            const endpointUrl = `${graphBaseUrl}${apiKey}/subgraphs/id/${subgraphId}`;
            
            let query = rawQueryInput.value.trim(); 
            const config = ENTITY_CONFIG[entityName];
            let expectedEntityKey = entityName;
            
            // For single queries, use the singular query name
            if (config && config.queryType === 'single') {
                expectedEntityKey = config.singularQuery;
            }

            if (!query) {
                errorAlert.textContent = 'The query field cannot be empty.';
                errorAlert.classList.remove('hidden');
                return;
            }

            // Try to deduce the main key for manual override mode
            if (isManualOverride) {
                const match = query.match(/\{[\s\n]*(\w+)(?:\s|\()/i);
                expectedEntityKey = match ? match[1] : entityName;
            }

            // 2. VALIDATION AND UI RESET
            outputArea.innerHTML = `
                <div class="flex items-center justify-center py-16">
                    <div class="loader rounded-full border-4 border-[#555555] border-t-transparent h-8 w-8"></div>
                </div>`;
            document.getElementById('resultMeta').textContent = '';
            errorAlert.classList.add('hidden');
            copyButton.classList.add('hidden');
            copyButton.classList.remove('flex');
            executeButton.disabled = true;

            // Disable pagination buttons temporarily during query execution
            document.getElementById('prevPageButton').disabled = true;
            document.getElementById('nextPageButton').disabled = true;


            if (!apiKey || !subgraphId) {
                errorAlert.textContent = 'Please enter the API Key and Subgraph ID in Settings.';
                errorAlert.classList.remove('hidden');
                executeButton.disabled = false;
                return;
            }

            console.log("GraphQL Endpoint:", endpointUrl);
            console.log("GraphQL Query:", query);

            // 3. QUERY EXECUTION WITH BACKOFF
            try {
                let response;
                let attempt = 0;
                const maxRetries = 5;

                while (attempt < maxRetries) {
                    try {
                        response = await fetch(endpointUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json',
                            },
                            body: JSON.stringify({ query }),
                        });
                        if (response.status !== 429) {  
                            break;  
                        }
                    } catch (e) {
                        console.error(`Attempt ${attempt + 1} failed:`, e);
                    }

                    attempt++;
                    if (attempt < maxRetries) {
                        const delay = Math.pow(2, attempt) * 1000;
                        console.log(`Retrying in ${delay / 1000}s...`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }

                if (!response || !response.ok) {
                    const errorText = response ? await response.text() : 'No response from server.';
                    throw new Error(`HTTP Response: ${response?.status || 'N/A'}. Detalhes: ${errorText.substring(0, 100)}...`);
                }

                const jsonResponse = await response.json();
                
                if (jsonResponse.errors) {
                    throw new Error(JSON.stringify(jsonResponse.errors, null, 2));
                }
                
                // 4. RESPONSE PROCESSING
                let rawData = jsonResponse.data;
                
                // --- Determine Data Structure for Formatting ---
                let dataToProcess;

                // A single root field (e.g. a list fallback for a single query) is always the entity key
                if (!isManualOverride && rawData && Object.keys(rawData).length === 1) {
                    expectedEntityKey = Object.keys(rawData)[0];
                }

                if (Object.keys(rawData).length > 1 || isManualOverride) {
                    // Treat as multiple results or complex manual query; process all root fields
                    dataToProcess = rawData;
                    lastResultCount = document.getElementById('queryLimit').value; // Cannot reliably count on complex multi-queries
                }
                else if (rawData[expectedEntityKey]) {
                    // Standard case: single entity list or object
                    dataToProcess = Array.isArray(rawData[expectedEntityKey]) ? rawData[expectedEntityKey] : [rawData[expectedEntityKey]];
                    lastResultCount = Array.isArray(rawData[expectedEntityKey]) ? rawData[expectedEntityKey].length : 1;
                } else {
                    // Fallback to display the full JSON
                    dataToProcess = rawData;
                    lastResultCount = 0;
                }
                
                // 5. FORMATTING AND DISPLAY
                
                const processEntityList = (data) => {
                     // Ensure data is treated as an array of objects for iteration
                     const list = Array.isArray(data) ? data : (data ? [data] : []);

                     return list.map(item => {
                         const newItem = { ...item };
                         
                         const recursiveProcessor = (obj) => {
                             for (const key in obj) {
                                 if (obj.hasOwnProperty(key)) {
                                     // BigInt/Wei Formatting 
                                     if (key.endsWith('Wei') || key === 'amount' || key.toLowerCase().includes('value')) {
                                         if (String(obj[key]).length > 10 && String(obj[key]).match(/^\d+$/)) {
                                              obj[`${key}_formatted`] = formatWei(obj[key]);
                                         }
                                     }
                                     // Timestamp Formatting
                                     if (key.toLowerCase().includes('timestamp') || key.toLowerCase().includes('date') || key.toLowerCase().includes('createdat') || key.toLowerCase().includes('lastseen')) {
                                          if (String(obj[key]).length <= 10 && String(obj[key]).match(/^\d+$/)) {
                                              obj[`${key}_formatted_date`] = formatTimestamp(obj[key]);
                                          }
                                     }
                                     // Nested object / list recursion
                                     if (Array.isArray(obj[key])) {
                                         obj[key].forEach(child => {
                                             if (typeof child === 'object' && child !== null) recursiveProcessor(child);
                                         });
                                     } else if (typeof obj[key] === 'object' && obj[key] !== null) {
                                         recursiveProcessor(obj[key]);
                                     }
                                 }
                             }
                         };
                         recursiveProcessor(newItem);
 
                         // Top-level object specific formatting (outside recursive)
                         if (newItem.operator?.operatorsCutFraction) {
                              const cut = formatWei(newItem.operator.operatorsCutFraction);
                              newItem.operator.operatorsCutFraction_formatted_percent = `${(parseFloat(cut) * 100).toFixed(2)}%`;
                         }
                         if (newItem.sponsorship?.spotAPY) {
                              newItem.sponsorship.spotAPY_formatted_percent = `${(parseFloat(newItem.sponsorship.spotAPY) * 100).toFixed(2)}%`;
                         }
                         return newItem;
                     });
                };
                
                let finalFormattedOutput = {};

                if (Array.isArray(dataToProcess)) {
                     // Single result list
                     finalFormattedOutput = processEntityList(dataToProcess);
                } else {
                    // Process multiple root fields (dataToProcess = rawData)
                    for (const key in dataToProcess) {
                         if (dataToProcess.hasOwnProperty(key)) {
                             const data = dataToProcess[key];
                             finalFormattedOutput[key] = processEntityList(data);
                         }
                    }
                }
                
                const jsonString = JSON.stringify(finalFormattedOutput, null, 2);
                
                // Render as text: subgraph data (e.g. stream metadata) is user-controlled
                const pre = document.createElement('pre');
                pre.className = 'json-output text-xs sm:text-sm font-mono text-gray-300';
                pre.textContent = jsonString;
                outputArea.replaceChildren(pre);
                outputArea.dataset.rawJson = jsonString; 
                copyButton.classList.remove('hidden');
                copyButton.classList.add('flex');

                const resultCount = Array.isArray(finalFormattedOutput) ? finalFormattedOutput.length : null;
                document.getElementById('resultMeta').textContent = resultCount === null
                    ? ''
                    : `${resultCount} result${resultCount === 1 ? '' : 's'}`;

            } catch (error) {
                console.error("GraphQL Query Error:", error);
                errorAlert.textContent = `Error loading data: ${error.message}`;
                outputArea.innerHTML = `<p class="text-red-400">Query failed.</p>`;
                errorAlert.classList.remove('hidden');
                copyButton.classList.add('hidden');
                copyButton.classList.remove('flex');
                showToast({ type: 'error', title: 'Query failed', message: 'See the error details below the result.' });
            } finally {
                executeButton.disabled = false;
                checkPaginationButtons(); // Re-enable based on the last result count
            }
        }

        window.onload = function () {
            // Populate entity select and sidebar navigation with categories
            populateEntityDropdown();
            
            // Initialize filters with the default entity
            updateFilterInputs();

            // Call the initial query on load (if inputs are valid)
            setTimeout(() => {
                checkInputs();
                if (!document.getElementById('executeButton').disabled) {
                    executeQuery();
                }
            }, 500); 
        }

    </script>
